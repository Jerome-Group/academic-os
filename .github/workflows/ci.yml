name: CI

# All three triggers, because a template has to be right for the typical repository, whose check
# is not a pure function of its own tree — it installs from a network and can rot in place while
# nothing is pushed (ADR-0010, in the management hub). Drop one only with the reason recorded in
# this repository's own `docs/adr/`.
on:
  pull_request:
  push:
    branches: [main]
  # GitHub disables a schedule after 60 days without repository activity, and emails the Owner
  # when it does.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      # The seeded LaTeX set is this repository's other artefact, and `CODING_STANDARDS.md` §5 puts
      # a template tree under the same obligation as the code. It rides in this job rather than its
      # own because every job here is named one by one in the hub's ruleset as a required context:
      # a new job is a new context, and until the hub names it the conformance check reads it as
      # ungated. Promoting it later is that one line in the hub plus a job here.
      #
      # TeX comes from the runner's own apt rather than a marketplace action. Both candidates would
      # be a new third-party dependency in the one place a compromise runs with the repository
      # checked out, and the maintained one carries very little use behind it (#121). Distribution
      # packages buy the same compilation for a longer install and no new trust — and it installs
      # after the tests above, so a broken test does not wait on TeX to say so.
      #
      # `--no-install-recommends` is what keeps this inside the timeout: the recommends of
      # texlive-latex-extra pull in most of TeX Live.
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures
      - name: Compile the seeded LaTeX set
        run: npm run templates:check

  rule-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rule-coverage:check

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run privacy:check

  checks:
    if: always()
    needs: [format, lint, typecheck, test, rule-coverage, privacy]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag cannot change what runs here.
      # Dependabot is what moves these pins forward (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CLAUDE.md is still a symlink to AGENTS.md
        run: |
          mode=$(git ls-files -s CLAUDE.md | cut -d' ' -f1)
          [ "$mode" = 120000 ] || {
            echo "CLAUDE.md has mode '${mode:-missing}', expected 120000." >&2
            echo "A regular file here drifts from AGENTS.md silently." >&2
            exit 1
          }

      - name: MAP.md exists
        run: test -f MAP.md

      - name: Every code check passed
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RULE_COVERAGE_RESULT: ${{ needs.rule-coverage.result }}
          PRIVACY_RESULT: ${{ needs.privacy.result }}
        run: |
          test "$FORMAT_RESULT" = success
          test "$LINT_RESULT" = success
          test "$TYPECHECK_RESULT" = success
          test "$TEST_RESULT" = success
          test "$RULE_COVERAGE_RESULT" = success
          test "$PRIVACY_RESULT" = success

      # This repository's checks are above. What they owe —
      # what CI must prove, how the checks grow, and why none of them gets a path filter — is
      # `CODING_STANDARDS.md` §5, which is the text rather than a summary of it.
      #
      # This job *is* a required status check from the repository's first day: the two steps
      # above can genuinely go red, and "red ⇒ no merge" never lets through something that would
      # otherwise have been caught (ADR-0017).
      #
      # Auto-merge is the opposite claim — "green ⇒ merge" — and stays off until the checks here
      # would fail for the kind of change being merged, which is the whole basis of ADR-0010's
      # opt-in. A skeleton tick is not evidence.
      #
      # Renaming this job renames the check context, which the `Required checks` ruleset names by
      # hand. Rename both, or every merge blocks on a check that will never report.
